server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's internal DNS. Re-resolving "backend" lets nginx start and keep working while the backend restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Browser -> /api/...  ->  backend container (service name "backend", port 5000)
  location /api/ {
    set $backend_upstream http://backend:5000;
    proxy_pass $backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Backend health through the frontend address (handy for quick checks)
  location = /health {
    set $backend_upstream http://backend:5000;
    proxy_pass $backend_upstream;
  }

  # React single-page app: unknown paths fall back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
